<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768">
  <!-- 关3-题1：写作业时一只手偷偷玩手机，桌面杂乱、分心 -->
  <rect width="1024" height="768" fill="#FDF6E3"/>
  <!-- 书桌 -->
  <rect x="172" y="500" width="680" height="30" rx="12" fill="#D9A066"/>
  <rect x="212" y="530" width="26" height="180" rx="10" fill="#C08A52"/>
  <rect x="786" y="530" width="26" height="180" rx="10" fill="#C08A52"/>
  <!-- 摊开的作业本 -->
  <g transform="rotate(-3 420 480)">
    <rect x="330" y="440" width="190" height="66" rx="8" fill="#FFFFFF" stroke="#E0D8C8" stroke-width="4"/>
    <path d="M352 462h100M352 480h130M352 444h80" stroke="#C9D8C9" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- 歪倒的笔 -->
  <rect x="560" y="478" width="70" height="10" rx="5" fill="#E8907A" transform="rotate(14 560 478)"/>
  <!-- 揉皱的纸团 -->
  <circle cx="660" cy="478" r="18" fill="#F0EBE0" stroke="#D8D0C0" stroke-width="3"/>
  <circle cx="700" cy="486" r="13" fill="#F0EBE0" stroke="#D8D0C0" stroke-width="3"/>
  <!-- 歪斜的书堆 -->
  <rect x="212" y="462" width="110" height="20" rx="6" fill="#9AD0F5" transform="rotate(-6 212 462)"/>
  <rect x="220" y="440" width="96" height="20" rx="6" fill="#F6A6B8" transform="rotate(4 220 440)"/>
  <!-- 小学生（坐桌前，身体朝作业本，头却低向手机） -->
  <rect x="390" y="340" width="180" height="170" rx="50" fill="#F6C9A8"/>
  <circle cx="470" cy="280" r="66" fill="#FFD9B3"/>
  <path d="M404 270a66 66 0 0 1 132 0v-14a66 40 0 0 0-132 0z" fill="#5B4A3F"/>
  <!-- 眼睛向下瞟（看手机方向） -->
  <circle cx="452" cy="292" r="7" fill="#3A3238"/>
  <circle cx="494" cy="292" r="7" fill="#3A3238"/>
  <path d="M438 276l20-4M486 272l20 4" stroke="#3A3238" stroke-width="5" stroke-linecap="round"/>
  <path d="M458 316q12 6 24 0" stroke="#3A3238" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- 桌上写字的手（装样子） -->
  <circle cx="380" cy="470" r="20" fill="#FFD9B3"/>
  <!-- 桌下偷偷举手机的手 -->
  <rect x="560" y="430" width="110" height="34" rx="17" fill="#F6C9A8" transform="rotate(22 560 430)"/>
  <circle cx="668" cy="452" r="18" fill="#FFD9B3"/>
  <g transform="rotate(16 700 430)">
    <rect x="676" y="380" width="56" height="100" rx="12" fill="#4A5A6A"/>
    <rect x="682" y="390" width="44" height="80" rx="6" fill="#B9E0F0"/>
    <rect x="688" y="400" width="32" height="8" rx="4" fill="#7FB3D8"/>
    <rect x="688" y="414" width="32" height="8" rx="4" fill="#9CC8E0"/>
    <rect x="688" y="428" width="24" height="8" rx="4" fill="#7FB3D8"/>
  </g>
  <!-- 手机微光映脸 -->
  <ellipse cx="520" cy="320" rx="36" ry="20" fill="#C9E0F0" opacity=".4"/>
  <!-- “嘘”提示符 -->
  <text x="740" y="360" font-size="44" fill="#C9B89A" font-family="sans-serif" font-weight="bold">…</text>
  <!-- 窗外太阳（白天学习时间） -->
  <circle cx="880" cy="130" r="44" fill="#FFD966"/>
  <g stroke="#FFD966" stroke-width="8" stroke-linecap="round">
    <line x1="880" y1="60" x2="880" y2="40"/><line x1="940" y1="130" x2="960" y2="130"/>
    <line x1="820" y1="130" x2="800" y2="130"/><line x1="923" y1="87" x2="937" y2="73"/>
    <line x1="837" y1="87" x2="823" y2="73"/>
  </g>
</svg>
