<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768">
  <!-- 关4-题3：游戏充值/打赏弹窗，小学生摆手拒绝 -->
  <rect width="1024" height="768" fill="#FBF2E8"/>
  <ellipse cx="140" cy="640" rx="90" ry="30" fill="#FFFFFF" opacity=".7"/>
  <!-- 手机（居中偏右，充值弹窗） -->
  <rect x="430" y="120" width="300" height="540" rx="38" fill="#4A5A6A"/>
  <rect x="448" y="152" width="264" height="476" rx="20" fill="#FFF6EC"/>
  <rect x="536" y="134" width="88" height="10" rx="5" fill="#2E3A44"/>
  <!-- 屏内游戏背景 -->
  <rect x="448" y="152" width="264" height="476" rx="20" fill="#F3E4D0"/>
  <circle cx="520" cy="230" r="24" fill="#FFD966"/>
  <rect x="470" y="560" width="220" height="50" rx="12" fill="#E8D4B8"/>
  <!-- 充值弹窗 -->
  <rect x="472" y="270" width="216" height="240" rx="18" fill="#FFFFFF" stroke="#F0C9A0" stroke-width="6"/>
  <rect x="472" y="270" width="216" height="42" rx="18" fill="#F8E3C4"/>
  <text x="580" y="299" font-size="24" text-anchor="middle" fill="#A8763E" font-family="sans-serif">充值中心</text>
  <circle cx="664" cy="291" r="10" fill="#FFFFFF"/>
  <path d="M660 287l8 8M668 287l-8 8" stroke="#B8894A" stroke-width="3.5" stroke-linecap="round"/>
  <!-- 金币图标（无具体数字） -->
  <circle cx="530" cy="360" r="22" fill="#FFD966" stroke="#E8B83E" stroke-width="5"/>
  <text x="530" y="369" font-size="24" text-anchor="middle" fill="#A8763E" font-family="sans-serif" font-weight="bold">¥</text>
  <circle cx="630" cy="360" r="22" fill="#FFD966" stroke="#E8B83E" stroke-width="5"/>
  <text x="630" y="369" font-size="24" text-anchor="middle" fill="#A8763E" font-family="sans-serif" font-weight="bold">¥</text>
  <!-- 皮肤/礼物图标 -->
  <rect x="506" y="404" width="48" height="40" rx="8" fill="#C9A8E0"/>
  <path d="M530 404v40M506 424h48" stroke="#A886C4" stroke-width="5"/>
  <rect x="606" y="404" width="48" height="40" rx="8" fill="#F6A6B8"/>
  <path d="M630 404v40M606 424h48" stroke="#D88698" stroke-width="5"/>
  <!-- 充值按钮 -->
  <rect x="510" y="460" width="140" height="34" rx="17" fill="#F0B86E"/>
  <text x="580" y="483" font-size="20" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif">立即充值</text>
  <!-- 小学生（左侧摆手拒绝） -->
  <rect x="130" y="460" width="220" height="210" rx="60" fill="#9AD0F5"/>
  <circle cx="240" cy="370" r="78" fill="#FFD9B3"/>
  <path d="M162 356a78 78 0 0 1 156 0v-16a78 48 0 0 0-156 0z" fill="#5B4A3F"/>
  <!-- 坚定表情 -->
  <circle cx="210" cy="372" r="7" fill="#3A3238"/>
  <circle cx="270" cy="372" r="7" fill="#3A3238"/>
  <path d="M198 354l22-6M262 348l22 6" stroke="#3A3238" stroke-width="6" stroke-linecap="round"/>
  <path d="M224 406h32" stroke="#3A3238" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="188" cy="394" rx="11" ry="7" fill="#FFB3A7" opacity=".7"/>
  <ellipse cx="292" cy="394" rx="11" ry="7" fill="#FFB3A7" opacity=".7"/>
  <!-- 摆手的手臂（朝手机方向摆动） -->
  <rect x="330" y="480" width="120" height="40" rx="20" fill="#9AD0F5" transform="rotate(-20 330 480)"/>
  <!-- 手掌（张开拒绝） -->
  <g transform="rotate(-12 458 442)">
    <rect x="440" y="410" width="40" height="56" rx="16" fill="#FFD9B3"/>
    <rect x="432" y="392" width="10" height="30" rx="5" fill="#FFD9B3"/>
    <rect x="446" y="386" width="10" height="32" rx="5" fill="#FFD9B3"/>
    <rect x="460" y="386" width="10" height="32" rx="5" fill="#FFD9B3"/>
    <rect x="474" y="392" width="10" height="30" rx="5" fill="#FFD9B3"/>
  </g>
  <!-- 摆动弧线 -->
  <path d="M420 380q-16 30 0 60M400 368q-24 44 0 88" stroke="#7FB3D8" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- “不可以”叉号标记 -->
  <circle cx="770" cy="240" r="40" fill="#FFFFFF" stroke="#E8A0A0" stroke-width="6"/>
  <path d="M752 222l36 36M788 222l-36 36" stroke="#C96F6F" stroke-width="9" stroke-linecap="round"/>
  <!-- 地面 -->
  <rect x="0" y="676" width="1024" height="92" fill="#F0E2CE"/>
  <ellipse cx="240" cy="682" rx="150" ry="13" fill="#E2D2BA"/>
</svg>
