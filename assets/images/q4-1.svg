<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768">
  <!-- 关4-题1：电脑网页弹出陌生广告弹窗、未知链接 -->
  <rect width="1024" height="768" fill="#E8F4F0"/>
  <ellipse cx="140" cy="120" rx="80" ry="30" fill="#FFFFFF" opacity=".8"/>
  <ellipse cx="890" cy="660" rx="90" ry="30" fill="#FFFFFF" opacity=".7"/>
  <!-- 显示器 -->
  <rect x="192" y="130" width="640" height="420" rx="22" fill="#4A5A6A"/>
  <rect x="212" y="150" width="600" height="380" rx="12" fill="#F4FAF8"/>
  <!-- 浏览器顶栏 -->
  <rect x="212" y="150" width="600" height="44" rx="12" fill="#D8E8E2"/>
  <circle cx="240" cy="172" r="8" fill="#F6A6A6"/>
  <circle cx="266" cy="172" r="8" fill="#F6D9A6"/>
  <circle cx="292" cy="172" r="8" fill="#A8D8A8"/>
  <rect x="330" y="160" width="360" height="24" rx="12" fill="#FFFFFF"/>
  <!-- 网页正文（简洁内容） -->
  <rect x="250" y="230" width="220" height="18" rx="9" fill="#C9DED6"/>
  <rect x="250" y="262" width="300" height="14" rx="7" fill="#DCEAE4"/>
  <rect x="250" y="288" width="260" height="14" rx="7" fill="#DCEAE4"/>
  <rect x="250" y="330" width="140" height="100" rx="12" fill="#D3EBDD"/>
  <circle cx="320" cy="372" r="22" fill="#8FD694"/>
  <!-- 陌生广告弹窗1 -->
  <g transform="rotate(-4 620 300)">
    <rect x="510" y="230" width="240" height="150" rx="16" fill="#FFFFFF" stroke="#F0B8B8" stroke-width="6"/>
    <rect x="510" y="230" width="240" height="38" rx="16" fill="#F8D9D9"/>
    <circle cx="726" cy="249" r="10" fill="#FFFFFF"/>
    <path d="M722 245l8 8M730 245l-8 8" stroke="#C96F6F" stroke-width="3.5" stroke-linecap="round"/>
    <text x="548" y="258" font-size="20" fill="#A85555" font-family="sans-serif">陌生广告</text>
    <path d="M540 300h120M540 326h90" stroke="#EBC9C9" stroke-width="10" stroke-linecap="round"/>
    <rect x="540" y="344" width="100" height="24" rx="12" fill="#F6A6A6"/>
  </g>
  <!-- 未知链接弹窗2 -->
  <g transform="rotate(5 400 440)">
    <rect x="300" y="390" width="220" height="120" rx="16" fill="#FFFFFF" stroke="#B8C9E8" stroke-width="6"/>
    <rect x="300" y="390" width="220" height="36" rx="16" fill="#D9E4F8"/>
    <circle cx="496" cy="408" r="10" fill="#FFFFFF"/>
    <path d="M492 404l8 8M500 404l-8 8" stroke="#5B7AB8" stroke-width="3.5" stroke-linecap="round"/>
    <!-- 链接图标 -->
    <path d="M340 460q-14 0-14-14t14-14h24M376 432q14 0 14 14t-14 14h-24" stroke="#7FA0D0" stroke-width="8" fill="none" stroke-linecap="round"/>
    <line x1="344" y1="446" x2="372" y2="446" stroke="#7FA0D0" stroke-width="8" stroke-linecap="round"/>
    <text x="430" y="458" font-size="26" fill="#5B7AB8" font-family="sans-serif" font-weight="bold">?</text>
    <rect x="420" y="470" width="80" height="20" rx="10" fill="#C9D8F0"/>
  </g>
  <!-- 鼠标指针（犹豫未点） -->
  <path d="M600 470l14 44 10-16 20-4z" fill="#4A5A6A" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
  <!-- 支架与桌 -->
  <rect x="492" y="550" width="40" height="36" fill="#4A5A6A"/>
  <rect x="420" y="584" width="184" height="18" rx="9" fill="#4A5A6A"/>
  <rect x="142" y="620" width="740" height="24" rx="12" fill="#C9A27E"/>
  <!-- 盾牌提示（防护意识） -->
  <g transform="translate(850 420)">
    <path d="M0 0q40-14 80 0v50q0 44-40 62-40-18-40-62z" fill="#8FD694"/>
    <path d="M22 48l16 18 26-34" stroke="#FFFFFF" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
