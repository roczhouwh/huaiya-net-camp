<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768">
  <!-- 关4-题2：聊天界面网友询问姓名学校住址，小学生疑惑思考 -->
  <rect width="1024" height="768" fill="#F0F4EA"/>
  <ellipse cx="860" cy="110" rx="90" ry="32" fill="#FFFFFF" opacity=".8"/>
  <!-- 小学生（左侧持手机，疑惑思考） -->
  <rect x="150" y="440" width="230" height="220" rx="60" fill="#F6C9A8"/>
  <circle cx="265" cy="348" r="80" fill="#FFD9B3"/>
  <path d="M185 334a80 80 0 0 1 160 0v-16a80 50 0 0 0-160 0z" fill="#5B4A3F"/>
  <!-- 疑惑表情 -->
  <circle cx="234" cy="350" r="7" fill="#3A3238"/>
  <circle cx="296" cy="350" r="7" fill="#3A3238"/>
  <path d="M220 330q12-8 24-4M286 326q12-4 24 4" stroke="#3A3238" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M250 386q15-8 30 0" stroke="#3A3238" stroke-width="6" fill="none" stroke-linecap="round"/>
  <ellipse cx="212" cy="372" rx="11" ry="7" fill="#FFB3A7" opacity=".7"/>
  <ellipse cx="318" cy="372" rx="11" ry="7" fill="#FFB3A7" opacity=".7"/>
  <!-- 思考气泡 -->
  <circle cx="150" cy="230" r="44" fill="#FFFFFF" stroke="#C9D8B9" stroke-width="5"/>
  <text x="150" y="248" font-size="52" text-anchor="middle" fill="#8FA86F" font-family="sans-serif" font-weight="bold">?</text>
  <circle cx="196" cy="286" r="12" fill="#FFFFFF" stroke="#C9D8B9" stroke-width="4"/>
  <circle cx="218" cy="306" r="8" fill="#FFFFFF" stroke="#C9D8B9" stroke-width="4"/>
  <!-- 持手机的手 -->
  <rect x="360" y="500" width="120" height="38" rx="19" fill="#F6C9A8" transform="rotate(-14 360 500)"/>
  <circle cx="482" cy="488" r="20" fill="#FFD9B3"/>
  <!-- 手机：聊天界面 -->
  <g transform="rotate(-6 640 400)">
    <rect x="520" y="130" width="250" height="520" rx="32" fill="#4A5A6A"/>
    <rect x="536" y="162" width="218" height="456" rx="18" fill="#EEF4E8"/>
    <!-- 聊天顶栏 -->
    <rect x="536" y="162" width="218" height="46" rx="18" fill="#D8E4CC"/>
    <circle cx="566" cy="185" r="14" fill="#B9A8C9"/>
    <text x="590" y="192" font-size="20" fill="#6A7A5A" font-family="sans-serif">陌生网友</text>
    <!-- 对方气泡1：你叫什么名字？ -->
    <rect x="552" y="228" width="160" height="44" rx="14" fill="#FFFFFF" stroke="#D8E0D0" stroke-width="3"/>
    <text x="632" y="256" font-size="21" text-anchor="middle" fill="#5A6A50" font-family="sans-serif">你叫什么名字?</text>
    <!-- 对方气泡2：你在哪个学校? -->
    <rect x="552" y="288" width="160" height="44" rx="14" fill="#FFFFFF" stroke="#D8E0D0" stroke-width="3"/>
    <text x="632" y="316" font-size="21" text-anchor="middle" fill="#5A6A50" font-family="sans-serif">你在哪个学校?</text>
    <!-- 对方气泡3：你家住在哪儿? -->
    <rect x="552" y="348" width="160" height="44" rx="14" fill="#FFFFFF" stroke="#D8E0D0" stroke-width="3"/>
    <text x="632" y="376" font-size="21" text-anchor="middle" fill="#5A6A50" font-family="sans-serif">你家住在哪儿?</text>
    <!-- 输入框（未回复） -->
    <rect x="552" y="548" width="150" height="36" rx="18" fill="#FFFFFF" stroke="#D8E0D0" stroke-width="3"/>
    <circle cx="726" cy="566" r="16" fill="#A8C898"/>
    <path d="M719 566h14M726 559v14" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- 警示小旗 -->
  <g transform="translate(830 480)">
    <rect x="0" y="0" width="10" height="90" rx="5" fill="#C9A27E"/>
    <path d="M10 6h70l-16 22 16 22H10z" fill="#F6A6A6"/>
    <text x="42" y="42" font-size="26" text-anchor="middle" fill="#A85555" font-family="sans-serif" font-weight="bold">!</text>
  </g>
  <!-- 地面 -->
  <rect x="0" y="670" width="1024" height="98" fill="#DDE8D2"/>
  <ellipse cx="265" cy="676" rx="160" ry="14" fill="#CBDCC0"/>
</svg>
