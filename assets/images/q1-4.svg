<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768">
  <!-- 关1-题4：五张内容卡片（科普视频/历史动画/我的世界/恶搞短视频/嘈杂解说） -->
  <rect width="1024" height="768" fill="#F3EDFB"/>
  <circle cx="120" cy="100" r="40" fill="#FFFFFF" opacity=".7"/>
  <circle cx="910" cy="660" r="52" fill="#FFFFFF" opacity=".7"/>
  <!-- 卡片1：自然科普视频 -->
  <g>
    <rect x="80" y="90" width="260" height="280" rx="24" fill="#FFFFFF" stroke="#C9E7D2" stroke-width="6"/>
    <rect x="108" y="118" width="204" height="150" rx="16" fill="#DFF1E4"/>
    <circle cx="178" cy="180" r="34" fill="#7FC8E8"/>
    <ellipse cx="178" cy="180" rx="54" ry="13" fill="none" stroke="#B8E6F5" stroke-width="7" transform="rotate(-18 178 180)"/>
    <path d="M238 220q26-22 50-5-21 26-50 5z" fill="#8FD694"/>
    <path d="M150 230l6 12 13 2-9 9 2 13-12-6-12 6 2-13-9-9 13-2z" fill="#FFD966"/>
    <text x="210" y="320" font-size="34" text-anchor="middle" fill="#4A5A6A" font-family="sans-serif">自然科普视频</text>
  </g>
  <!-- 卡片2：历史文化动画 -->
  <g>
    <rect x="382" y="90" width="260" height="280" rx="24" fill="#FFFFFF" stroke="#E7D2B8" stroke-width="6"/>
    <rect x="410" y="118" width="204" height="150" rx="16" fill="#FBEFD8"/>
    <!-- 小古塔 -->
    <path d="M486 200h52l-8-24h-36z" fill="#C96F6F"/>
    <path d="M478 176h68l-34-22z" fill="#A85555"/>
    <rect x="492" y="200" width="40" height="56" fill="#E8B4B8"/>
    <path d="M470 256h84l-10-14h-64z" fill="#C96F6F"/>
    <circle cx="578" cy="150" r="14" fill="#FFD966"/>
    <text x="512" y="320" font-size="34" text-anchor="middle" fill="#4A5A6A" font-family="sans-serif">历史文化动画</text>
  </g>
  <!-- 卡片3：我的世界益智游戏 -->
  <g>
    <rect x="684" y="90" width="260" height="280" rx="24" fill="#FFFFFF" stroke="#B8D8E7" stroke-width="6"/>
    <rect x="712" y="118" width="204" height="150" rx="16" fill="#DFF0F8"/>
    <rect x="772" y="180" width="40" height="40" fill="#8FD694"/>
    <rect x="812" y="180" width="40" height="40" fill="#C9A27E"/>
    <rect x="792" y="140" width="40" height="40" fill="#E8B4B8"/>
    <rect x="772" y="220" width="80" height="26" fill="#7CC47F"/>
    <text x="814" y="320" font-size="32" text-anchor="middle" fill="#4A5A6A" font-family="sans-serif">我的世界游戏</text>
  </g>
  <!-- 卡片4：恶搞搞笑短视频 -->
  <g>
    <rect x="230" y="410" width="260" height="280" rx="24" fill="#FFFFFF" stroke="#E7C9C9" stroke-width="6"/>
    <rect x="258" y="438" width="204" height="150" rx="16" fill="#FBE4E4"/>
    <!-- 搞怪脸 -->
    <circle cx="360" cy="510" r="42" fill="#FFD9B3"/>
    <circle cx="346" cy="502" r="6" fill="#3A3238"/>
    <circle cx="376" cy="498" r="9" fill="#3A3238"/>
    <path d="M342 528q18 14 36-2" stroke="#3A3238" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M330 486l14-8M380 482l14-10" stroke="#3A3238" stroke-width="5" stroke-linecap="round"/>
    <path d="M314 470q-10-12 2-20M404 464q12-10 2-22" stroke="#E89A9A" stroke-width="5" fill="none" stroke-linecap="round"/>
    <text x="360" y="640" font-size="34" text-anchor="middle" fill="#4A5A6A" font-family="sans-serif">恶搞短视频</text>
  </g>
  <!-- 卡片5：嘈杂游戏解说 -->
  <g>
    <rect x="534" y="410" width="260" height="280" rx="24" fill="#FFFFFF" stroke="#D8C9E7" stroke-width="6"/>
    <rect x="562" y="438" width="204" height="150" rx="16" fill="#EFE4F8"/>
    <!-- 喇叭+噪音线 -->
    <path d="M610 500h34l34-26v76l-34-26h-34z" fill="#9A8AC2"/>
    <path d="M696 486q16 26 0 52M716 474q24 38 0 76" stroke="#B9A8D8" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M600 462l-14-12M596 560l-16 12" stroke="#C9B9E0" stroke-width="6" stroke-linecap="round"/>
    <text x="664" y="640" font-size="32" text-anchor="middle" fill="#4A5A6A" font-family="sans-serif">嘈杂游戏解说</text>
  </g>
</svg>
