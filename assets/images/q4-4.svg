<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768">
  <!-- 关4-题4：小学生关掉手机，转身告诉家长老师，温暖正向 -->
  <rect width="1024" height="768" fill="#FFF4EC"/>
  <!-- 温暖光晕 -->
  <circle cx="512" cy="330" r="240" fill="#FFE9D0" opacity=".6"/>
  <circle cx="512" cy="330" r="160" fill="#FFDFC0" opacity=".5"/>
  <!-- 爱心点缀 -->
  <path d="M150 150q-16-20 4-34 14-8 24 6 10-14 24-6 20 14 4 34l-28 26z" fill="#F6A6B8" opacity=".9"/>
  <path d="M850 130q-12-15 3-25 10-6 18 4 8-10 18-4 15 10 3 25l-21 19z" fill="#F8C0A0" opacity=".9"/>
  <path d="M900 560q-10-13 2-21 9-5 15 4 6-9 15-4 12 8 2 21l-17 16z" fill="#F6A6B8" opacity=".8"/>
  <!-- 家长/老师（右侧大人，蹲身倾听） -->
  <rect x="640" y="380" width="220" height="290" rx="70" fill="#C9A8D8"/>
  <circle cx="750" cy="300" r="76" fill="#FFD9B3"/>
  <path d="M674 288a76 76 0 0 1 152 0v-16a76 48 0 0 0-152 0z" fill="#7A5C48"/>
  <!-- 温柔微笑 -->
  <circle cx="722" cy="300" r="7" fill="#3A3238"/>
  <circle cx="778" cy="300" r="7" fill="#3A3238"/>
  <path d="M730 330q20 14 40 0" stroke="#3A3238" stroke-width="6" fill="none" stroke-linecap="round"/>
  <ellipse cx="700" cy="322" rx="11" ry="7" fill="#FFB3A7" opacity=".7"/>
  <ellipse cx="800" cy="322" rx="11" ry="7" fill="#FFB3A7" opacity=".7"/>
  <!-- 伸出的手（安抚/接纳） -->
  <rect x="620" y="440" width="110" height="38" rx="19" fill="#C9A8D8" transform="rotate(12 620 440)"/>
  <circle cx="628" cy="470" r="20" fill="#FFD9B3"/>
  <!-- 小学生（左侧，关掉手机走向大人） -->
  <rect x="200" y="460" width="200" height="210" rx="56" fill="#8FD694"/>
  <circle cx="300" cy="376" r="72" fill="#FFD9B3"/>
  <path d="M228 364a72 72 0 0 1 144 0v-14a72 44 0 0 0-144 0z" fill="#5B4A3F"/>
  <!-- 安心表情 -->
  <path d="M268 380q10 8 20 0M312 380q10 8 20 0" stroke="#3A3238" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M282 408q18 12 36 0" stroke="#3A3238" stroke-width="6" fill="none" stroke-linecap="round"/>
  <ellipse cx="252" cy="400" rx="10" ry="6" fill="#FFB3A7" opacity=".7"/>
  <ellipse cx="348" cy="400" rx="10" ry="6" fill="#FFB3A7" opacity=".7"/>
  <!-- 说话气泡（告诉家长） -->
  <path d="M390 300q60-50 140-40 60 8 60 50t-60 50q-70 12-140-40l-30 6z" fill="#FFFFFF" stroke="#F0D0B0" stroke-width="5"/>
  <text x="480" y="300" font-size="26" text-anchor="middle" fill="#A8763E" font-family="sans-serif">我看到了不好的</text>
  <text x="480" y="334" font-size="26" text-anchor="middle" fill="#A8763E" font-family="sans-serif">内容…</text>
  <!-- 关掉的手机（屏幕熄灭，朝下拿） -->
  <g transform="rotate(24 240 560)">
    <rect x="216" y="520" width="52" height="96" rx="12" fill="#6A7684"/>
    <rect x="222" y="530" width="40" height="76" rx="6" fill="#3A434E"/>
  </g>
  <!-- 电源小图标 -->
  <circle cx="470" cy="620" r="22" fill="#FFFFFF" stroke="#B9C4CE" stroke-width="4"/>
  <path d="M470 610v12" stroke="#8A96A2" stroke-width="5" stroke-linecap="round"/>
  <path d="M461 616a13 13 0 1 0 18 0" stroke="#8A96A2" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- 地面 -->
  <rect x="0" y="676" width="1024" height="92" fill="#F6E3D0"/>
  <ellipse cx="300" cy="682" rx="150" ry="13" fill="#EAD3BC"/>
  <ellipse cx="750" cy="682" rx="160" ry="13" fill="#EAD3BC"/>
</svg>
