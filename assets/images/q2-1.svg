<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768">
  <!-- 关2-题1：手机屏幕夸张吵闹的游戏解说，线条杂乱氛围嘈杂 -->
  <rect width="1024" height="768" fill="#FFF1E6"/>
  <!-- 杂乱背景线（喧闹感） -->
  <g stroke="#F5C9A8" stroke-width="8" stroke-linecap="round" fill="none" opacity=".8">
    <path d="M80 140q40-30 80 0t80 0"/>
    <path d="M790 120q30 40 70 10"/>
    <path d="M120 640q50 20 90-10"/>
    <path d="M830 620l30-30M860 640l30-30"/>
  </g>
  <path d="M140 300l14 26 30 6-20 22 4 30-28-14-27 14 4-30-21-22 30-6z" fill="#FFD966" opacity=".7"/>
  <path d="M880 260l10 20 22 4-15 16 3 23-20-10-20 10 3-23-15-16 22-4z" fill="#F6A6B8" opacity=".8"/>
  <!-- 大手机 -->
  <rect x="352" y="110" width="320" height="560" rx="40" fill="#4A5A6A"/>
  <rect x="372" y="150" width="280" height="480" rx="22" fill="#FDE8D8"/>
  <rect x="472" y="126" width="80" height="10" rx="5" fill="#2E3A44"/>
  <!-- 屏幕：吵闹解说 -->
  <!-- 大喊的解说员 -->
  <circle cx="512" cy="330" r="56" fill="#FFD9B3"/>
  <path d="M456 318a56 56 0 0 1 112 0v-14a56 36 0 0 0-112 0z" fill="#3F342C"/>
  <circle cx="490" cy="326" r="7" fill="#3A3238"/>
  <circle cx="534" cy="326" r="7" fill="#3A3238"/>
  <ellipse cx="512" cy="358" rx="16" ry="12" fill="#C96F6F"/>
  <!-- 声波 -->
  <path d="M584 320q20 24 0 48M606 306q30 38 0 76" stroke="#E89A6F" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M440 320q-20 24 0 48M418 306q-30 38 0 76" stroke="#E89A6F" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- 感叹号气泡 -->
  <g>
    <rect x="404" y="440" width="60" height="52" rx="14" fill="#FFD966"/>
    <text x="434" y="478" font-size="38" text-anchor="middle" fill="#A8662A" font-family="sans-serif" font-weight="bold">!</text>
    <rect x="480" y="452" width="72" height="52" rx="14" fill="#F6A6B8"/>
    <text x="516" y="490" font-size="34" text-anchor="middle" fill="#A85568" font-family="sans-serif" font-weight="bold">!!</text>
    <rect x="566" y="440" width="60" height="52" rx="14" fill="#9AD0F5"/>
    <text x="596" y="478" font-size="36" text-anchor="middle" fill="#3F6E9E" font-family="sans-serif" font-weight="bold">!</text>
  </g>
  <!-- 杂乱进度条 -->
  <path d="M400 560l30-14 30 14 30-14 30 14 30-14 30 14" stroke="#C9B9A8" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- 地上捂耳的小学生 -->
  <rect x="140" y="560" width="120" height="90" rx="36" fill="#8FD694"/>
  <circle cx="200" cy="520" r="48" fill="#FFD9B3"/>
  <path d="M152 514a48 48 0 0 1 96 0v-10a48 30 0 0 0-96 0z" fill="#5B4A3F"/>
  <path d="M176 520q8 8 16 0M208 520q8 8 16 0" stroke="#3A3238" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M188 546q12-6 24 0" stroke="#3A3238" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- 捂耳的手 -->
  <circle cx="148" cy="524" r="16" fill="#FFD9B3"/>
  <circle cx="252" cy="524" r="16" fill="#FFD9B3"/>
  <!-- 右侧眩晕小人 -->
  <rect x="770" y="560" width="120" height="90" rx="36" fill="#9AD0F5"/>
  <circle cx="830" cy="520" r="48" fill="#FFD9B3"/>
  <path d="M782 514a48 48 0 0 1 96 0v-10a48 30 0 0 0-96 0z" fill="#3F342C"/>
  <path d="M806 514l12 12M818 514l-12 12M842 514l12 12M854 514l-12 12" stroke="#3A3238" stroke-width="4" stroke-linecap="round"/>
  <path d="M818 546q12-8 24 0" stroke="#3A3238" stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>
