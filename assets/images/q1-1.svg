<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768">
  <!-- 关1-题1：小学生看平板科普动画（宇宙星球+动植物） -->
  <rect width="1024" height="768" fill="#E8F6EF"/>
  <circle cx="130" cy="110" r="46" fill="#FFF3C9"/>
  <ellipse cx="850" cy="120" rx="90" ry="34" fill="#FFFFFF" opacity=".8"/>
  <ellipse cx="920" cy="150" rx="70" ry="26" fill="#FFFFFF" opacity=".7"/>
  <!-- 书桌 -->
  <rect x="212" y="560" width="600" height="34" rx="14" fill="#D9A066"/>
  <rect x="252" y="594" width="26" height="120" rx="10" fill="#C08A52"/>
  <rect x="746" y="594" width="26" height="120" rx="10" fill="#C08A52"/>
  <!-- 平板（立在桌上） -->
  <g transform="rotate(-4 512 430)">
    <rect x="322" y="270" width="380" height="280" rx="26" fill="#4A5A6A"/>
    <rect x="340" y="288" width="344" height="244" rx="16" fill="#2E3D54"/>
    <!-- 屏幕内容：星球 -->
    <circle cx="450" cy="380" r="46" fill="#7FC8E8"/>
    <ellipse cx="450" cy="380" rx="74" ry="18" fill="none" stroke="#B8E6F5" stroke-width="8" transform="rotate(-18 450 380)"/>
    <circle cx="436" cy="368" r="9" fill="#A8DEF0"/>
    <circle cx="462" cy="392" r="6" fill="#A8DEF0"/>
    <!-- 星星 -->
    <path d="M580 320l7 15 16 2-12 11 3 16-14-8-14 8 3-16-12-11 16-2z" fill="#FFD966"/>
    <path d="M620 420l5 11 12 1-9 8 2 12-10-6-10 6 2-12-9-8 12-1z" fill="#FFD966"/>
    <circle cx="400" cy="460" r="5" fill="#FFD966"/>
    <circle cx="560" cy="480" r="5" fill="#FFD966"/>
    <!-- 小叶子（自然知识） -->
    <path d="M600 470q30-26 58-6-24 30-58 6z" fill="#8FD694"/>
    <path d="M604 468q22-8 44 0" stroke="#5FAE66" stroke-width="4" fill="none"/>
  </g>
  <!-- 小学生（背影/侧面，坐在桌前） -->
  <rect x="420" y="520" width="184" height="90" rx="40" fill="#7FB3E8"/>
  <circle cx="512" cy="440" r="66" fill="#FFD9B3"/>
  <path d="M446 430a66 66 0 0 1 132 0v-14a66 40 0 0 0-132 0z" fill="#5B4A3F"/>
  <circle cx="488" cy="446" r="6" fill="#3A3238"/>
  <circle cx="536" cy="446" r="6" fill="#3A3238"/>
  <path d="M498 470q14 12 28 0" stroke="#3A3238" stroke-width="5" fill="none" stroke-linecap="round"/>
  <ellipse cx="470" cy="464" rx="10" ry="6" fill="#FFB3A7" opacity=".7"/>
  <ellipse cx="554" cy="464" rx="10" ry="6" fill="#FFB3A7" opacity=".7"/>
  <!-- 地上盆栽 -->
  <rect x="120" y="620" width="70" height="60" rx="12" fill="#E8907A"/>
  <path d="M155 620q-34-40-6-74 8 34 20 50 6-46 30-58-2 44-12 62 20-30 40-26-16 34-72 46z" fill="#8FD694"/>
  <!-- 地上书本 -->
  <rect x="820" y="660" width="110" height="20" rx="6" fill="#F6A6B8"/>
  <rect x="830" y="640" width="96" height="20" rx="6" fill="#9AD0F5"/>
</svg>
