  <rect x="300" y="168" width="424" height="284" rx="12" fill="#DFF1E4"/>
  <circle cx="430" cy="280" r="42" fill="#FFD9B3"/>
  <path d="M388 272a42 42 0 0 1 84 0v-10a42 28 0 0 0-84 0z" fill="#7A5C48"/>
  <circle cx="416" cy="284" r="5" fill="#3A3238"/>
  <circle cx="444" cy="284" r="5" fill="#3A3238"/>
  <path d="M422 300q8 8 16 0" stroke="#3A3238" stroke-width="4" fill="none" stroke-linecap="round"/>
  <rect x="392" y="322" width="76" height="70" rx="24" fill="#8FA8D8"/>
  <!-- 老师举手指向黑板 -->
  <rect x="462" y="300" width="58" height="18" rx="9" fill="#FFD9B3" transform="rotate(-24 462 300)"/>
  <!-- 屏内小黑板 -->
  <rect x="520" y="210" width="170" height="130" rx="10" fill="#5B7A5E"/>
  <path d="M542 250h90M542 280h60" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
  <circle cx="660" cy="300" r="16" fill="none" stroke="#FFD966" stroke-width="6"/>
  <!-- 屏内播放条 -->
  <rect x="330" y="418" width="364" height="12" rx="6" fill="#C9D8C9"/>
  <rect x="330" y="418" width="150" height="12" rx="6" fill="#8FD694"/>
  <circle cx="480" cy="424" r="12" fill="#5FAE66"/>
  <!-- 支架与桌 -->
  <rect x="492" y="470" width="40" height="36" fill="#4A5A6A"/>
  <rect x="212" y="506" width="600" height="28" rx="12" fill="#D9A066"/>
  <rect x="252" y="534" width="26" height="170" rx="10" fill="#C08A52"/>
  <rect x="746" y="534" width="26" height="170" rx="10" fill="#C08A52"/>
  <!-- 键盘 -->
  <rect x="420" y="470" width="184" height="26" rx="10" fill="#E8E2D8"/>
  <!-- 小学生背影（坐桌前听课） -->
  <rect x="452" y="560" width="120" height="76" rx="34" fill="#9AD0F5"/>
  <circle cx="512" cy="540" r="48" fill="#FFD9B3"/>
  <path d="M464 534a48 48 0 0 1 96 0v-10a48 30 0 0 0-96 0z" fill="#3F342C"/>
  <!-- 笔记本与笔 -->
  <rect x="620" y="480" width="90" height="24" rx="8" fill="#FFF6C9"/>
  <rect x="700" y="466" width="10" height="40" rx="5" fill="#F6A6B8" transform="rotate(16 700 466)"/>
  <!-- 台灯 -->
  <rect x="160" y="470" width="14" height="60" rx="7" fill="#8A8F98"/>
  <path d="M167 470l60-40 14 16-60 40z" fill="#8A8F98"/>
  <ellipse cx="240" cy="440" rx="26" ry="18" fill="#FFD966"/>
  <circle cx="240" cy="446" r="10" fill="#FFF3C9"/>
</svg>
