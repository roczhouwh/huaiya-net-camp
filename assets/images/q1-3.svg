<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768">
  <!-- 关1-题3：网课学习场景，电脑屏幕老师讲课 -->
  <rect width="1024" height="768" fill="#FDF0E6"/>
  <rect x="60" y="80" width="180" height="120" rx="14" fill="#FFFFFF" stroke="#E8C9A8" stroke-width="6"/>
  <path d="M90 130h120M90 160h80" stroke="#B9D8B9" stroke-width="10" stroke-linecap="round"/>
