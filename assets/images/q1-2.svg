<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768">
  <!-- 关1-题2：端正坐姿玩我的世界，方块搭建房屋 -->
  <rect width="1024" height="768" fill="#E9F3FF"/>
  <ellipse cx="160" cy="120" rx="80" ry="30" fill="#FFFFFF" opacity=".8"/>
  <ellipse cx="880" cy="100" rx="90" ry="34" fill="#FFFFFF" opacity=".8"/>
  <!-- 显示器 -->
  <rect x="262" y="180" width="500" height="330" rx="22" fill="#4A5A6A"/>
  <rect x="282" y="200" width="460" height="290" rx="12" fill="#BEE3F8"/>
  <!-- 屏幕：方块世界 -->
  <rect x="282" y="420" width="460" height="70" fill="#8FD694"/>
  <!-- 草地格子 -->
  <g fill="#7CC47F">
    <rect x="300" y="430" width="40" height="14"/><rect x="380" y="452" width="40" height="14"/>
    <rect x="460" y="430" width="40" height="14"/><rect x="620" y="452" width="40" height="14"/>
    <rect x="680" y="430" width="40" height="14"/>
  </g>
  <!-- 方块房子 -->
  <rect x="430" y="300" width="160" height="120" fill="#E8B4B8"/>
  <g stroke="#D89AA0" stroke-width="4">
    <line x1="430" y1="340" x2="590" y2="340"/><line x1="430" y1="380" x2="590" y2="380"/>
    <line x1="470" y1="300" x2="470" y2="420"/><line x1="510" y1="300" x2="510" y2="420"/><line x1="550" y1="300" x2="550" y2="420"/>
  </g>
  <path d="M420 300l90-64 90 64z" fill="#C96F6F"/>
  <rect x="490" y="360" width="40" height="60" fill="#8A5A44"/>
  <rect x="445" y="320" width="30" height="30" fill="#FFF6C9"/>
  <rect x="545" y="320" width="30" height="30" fill="#FFF6C9"/>
  <!-- 太阳与云（屏内） -->
  <circle cx="660" cy="250" r="26" fill="#FFD966"/>
  <ellipse cx="350" cy="250" rx="40" ry="14" fill="#FFFFFF"/>
  <!-- 显示器支架 -->
  <rect x="492" y="510" width="40" height="40" fill="#4A5A6A"/>
  <rect x="420" y="548" width="184" height="18" rx="9" fill="#4A5A6A"/>
  <!-- 桌面 -->
  <rect x="192" y="566" width="640" height="26" rx="12" fill="#D9A066"/>
  <rect x="232" y="592" width="24" height="120" rx="10" fill="#C08A52"/>
  <rect x="768" y="592" width="24" height="120" rx="10" fill="#C08A52"/>
  <!-- 小学生（端坐，背影） -->
  <rect x="442" y="560" width="140" height="80" rx="36" fill="#F6A6B8"/>
  <circle cx="512" cy="530" r="54" fill="#FFD9B3"/>
  <path d="M458 522a54 54 0 0 1 108 0v-12a54 34 0 0 0-108 0z" fill="#5B4A3F"/>
  <!-- 积木块装饰 -->
  <rect x="120" y="640" width="52" height="52" rx="8" fill="#FFD966"/>
  <rect x="150" y="592" width="52" height="52" rx="8" fill="#7FC8E8"/>
  <rect x="852" y="620" width="52" height="52" rx="8" fill="#F6A6B8"/>
</svg>
