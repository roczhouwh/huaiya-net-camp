<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768">
  <!-- 关3-题4：三格对比插画（上课玩手机 / 写完作业限时用机 / 熬夜刷手机） -->
  <rect width="1024" height="768" fill="#F5F0E8"/>
  <!-- 格1：上课玩手机 -->
  <g>
    <rect x="40" y="80" width="300" height="600" rx="24" fill="#FFFFFF" stroke="#D8CFC0" stroke-width="6"/>
    <rect x="64" y="104" width="252" height="420" rx="16" fill="#EAE4D8"/>
    <!-- 黑板 -->
    <rect x="84" y="124" width="212" height="110" rx="10" fill="#5B7A5E"/>
    <path d="M104 160h120M104 190h80" stroke="#C9D8C9" stroke-width="8" stroke-linecap="round"/>
    <!-- 课桌与低头学生 -->
    <rect x="104" y="400" width="172" height="20" rx="8" fill="#C9A27E"/>
    <rect x="150" y="330" width="80" height="76" rx="26" fill="#E8B4B8"/>
    <circle cx="190" cy="300" r="34" fill="#FFD9B3"/>
    <path d="M156 294a34 34 0 0 1 68 0v-8a34 22 0 0 0-68 0z" fill="#4A3E35"/>
    <!-- 低头看手机 -->
    <rect x="196" y="360" width="34" height="56" rx="8" fill="#4A5A6A" transform="rotate(18 196 360)"/>
    <rect x="200" y="366" width="26" height="44" rx="4" fill="#B9DCF0" transform="rotate(18 200 366)"/>
    <path d="M164 300l10 4M206 296l10-4" stroke="#3A3238" stroke-width="4" stroke-linecap="round"/>
    <!-- 标签 -->
    <rect x="90" y="556" width="200" height="92" rx="14" fill="#F6E4E4"/>
    <text x="190" y="596" font-size="30" text-anchor="middle" fill="#A85555" font-family="sans-serif">上课偷玩</text>
    <text x="190" y="632" font-size="26" text-anchor="middle" fill="#A85555" font-family="sans-serif">手机</text>
  </g>
  <!-- 格2：写完作业限时用机 -->
  <g>
    <rect x="362" y="80" width="300" height="600" rx="24" fill="#FFFFFF" stroke="#B9D8B9" stroke-width="6"/>
    <rect x="386" y="104" width="252" height="420" rx="16" fill="#E4F2E4"/>
    <!-- 完成的作业本+勾 -->
    <rect x="416" y="130" width="100" height="30" rx="8" fill="#9AD0F5"/>
    <path d="M530 138l12 14 22-26" stroke="#5FAE66" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 计时器 -->
    <circle cx="586" cy="150" r="26" fill="#FFFFFF" stroke="#E8907A" stroke-width="5"/>
    <path d="M586 150v-14M586 150l10 6" stroke="#E8907A" stroke-width="4" stroke-linecap="round"/>
    <!-- 端正坐姿学生看平板 -->
    <rect x="436" y="300" width="150" height="100" rx="16" fill="#4A5A6A"/>
    <rect x="448" y="312" width="126" height="76" rx="8" fill="#DFF1E4"/>
    <circle cx="486" cy="346" r="18" fill="#7FC8E8"/>
    <path d="M520 360q16-12 30-2-13 16-30 2z" fill="#8FD694"/>
    <rect x="468" y="400" width="90" height="60" rx="24" fill="#8FD694"/>
    <circle cx="513" cy="380" r="34" fill="#FFD9B3"/>
    <path d="M479 374a34 34 0 0 1 68 0v-8a34 22 0 0 0-68 0z" fill="#5B4A3F"/>
    <rect x="416" y="470" width="190" height="18" rx="8" fill="#C9A27E"/>
    <!-- 太阳 -->
    <circle cx="420" cy="220" r="18" fill="#FFD966"/>
    <!-- 标签 -->
    <rect x="412" y="556" width="200" height="92" rx="14" fill="#DFF0E0"/>
    <text x="512" y="596" font-size="30" text-anchor="middle" fill="#3E7A46" font-family="sans-serif">完成作业后</text>
    <text x="512" y="632" font-size="26" text-anchor="middle" fill="#3E7A46" font-family="sans-serif">限时使用</text>
  </g>
  <!-- 格3：熬夜刷手机 -->
  <g>
    <rect x="684" y="80" width="300" height="600" rx="24" fill="#FFFFFF" stroke="#C9C0D8" stroke-width="6"/>
    <rect x="708" y="104" width="252" height="420" rx="16" fill="#3A4668"/>
    <!-- 月亮 -->
    <path d="M890 130a22 22 0 1 0 8 32 17 17 0 1 1-8-32z" fill="#FFE9A8"/>
    <circle cx="740" cy="140" r="3" fill="#FFE9A8"/>
    <circle cx="770" cy="170" r="3" fill="#FFE9A8"/>
    <!-- 床上学生 -->
    <rect x="728" y="380" width="212" height="30" rx="12" fill="#6E5F8E"/>
    <rect x="728" y="410" width="212" height="90" rx="16" fill="#5B4D78"/>
    <path d="M780 400q60-24 160-8v108H780z" fill="#8A7AB0"/>
    <circle cx="800" cy="380" r="32" fill="#FFD9B3"/>
    <path d="M768 375a32 32 0 0 1 64 0v-7a32 20 0 0 0-64 0z" fill="#4A3E35"/>
    <path d="M786 382q8 5 16 0M810 382q8 5 16 0" stroke="#3A3238" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- 亮屏手机 -->
    <rect x="852" y="360" width="36" height="62" rx="8" fill="#3A4654" transform="rotate(-14 852 360)"/>
    <rect x="856" y="366" width="28" height="50" rx="4" fill="#C9E4F5" transform="rotate(-14 856 366)"/>
    <ellipse cx="830" cy="380" rx="56" ry="40" fill="#9AC8E8" opacity=".25"/>
    <!-- 闹钟深夜 -->
    <circle cx="740" cy="330" r="18" fill="#FFF6C9"/>
    <path d="M740 330v-10M740 330l7 4" stroke="#6E5F4A" stroke-width="3" stroke-linecap="round"/>
    <!-- 标签 -->
    <rect x="734" y="556" width="200" height="92" rx="14" fill="#E4E0F0"/>
    <text x="834" y="596" font-size="30" text-anchor="middle" fill="#5B5280" font-family="sans-serif">熬夜刷</text>
    <text x="834" y="632" font-size="26" text-anchor="middle" fill="#5B5280" font-family="sans-serif">手机视频</text>
  </g>
</svg>
